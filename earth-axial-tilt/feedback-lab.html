<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Earth Feedbacks Lab</title></head>
<body><div class="fb-shell"><header><a href="./" data-fb="back"></a><div class="fb-tools"><label><span data-fb="language"></span><select id="fb-language"><option value="en">English</option><option value="ja">日本語</option></select></label><label class="fb-check"><input id="fb-large" type="checkbox"><span data-fb="large"></span></label></div></header>
<section class="fb-hero"><p class="fb-eyebrow" data-fb="eyebrow"></p><h1 data-fb="title"></h1><h2 data-fb="lead"></h2><p data-fb="intro"></p><p class="fb-scope" data-fb="scope"></p></section>
<main class="fb-layout"><aside><section class="fb-card"><label><span data-fb="preset"></span><select id="fb-preset"><option value="compare" data-fb="compare"></option><option value="memory" data-fb="memory"></option><option value="sweep" data-fb="sweep"></option><option value="custom">Custom path / 任意の経路</option></select></label>
<h2 data-fb="physics"></h2><div id="fb-science" class="fb-fields">
<label><span data-fb="tilt"></span><input id="fb-tilt" type="number" min="0" max="90" step="0.01"></label><label><span data-fb="depth"></span><select id="fb-depth"><option value="2.5">2.5</option><option value="10">10</option><option value="50">50</option></select></label>
<label><span data-fb="ecc"></span><input id="fb-ecc" type="number" min="0" max="0.3" step="0.01"></label><label><span data-fb="peri"></span><input id="fb-peri" type="number" step="1"></label><label><span data-fb="axis"></span><input id="fb-axis" type="number" step="1"></label>
<label><span data-fb="enabled"></span><select id="fb-enabled"><option value="true" data-fb="on"></option><option value="false" data-fb="off"></option></select></label>
<label class="fb-wide"><span data-fb="factors"></span><input id="fb-factors" type="text" maxlength="200" inputmode="decimal" aria-describedby="fb-factors-help"></label><p id="fb-factors-help" class="fb-help fb-wide" data-fb="factorsHelp"></p>
<label class="fb-wide" id="fb-seed-control"><span data-fb="seed"></span><select id="fb-seed"><option value="warm" data-fb="warm"></option><option value="cold" data-fb="cold"></option></select></label></div>
<div class="fb-actions"><button id="fb-run" class="fb-primary" data-fb="run"></button><button id="fb-cancel" data-fb="cancel" disabled></button></div><p id="fb-status" role="status" aria-live="polite"></p><p id="fb-form-error" role="alert"></p>
</section><details class="fb-card"><summary data-fb="share"></summary><p class="fb-help" data-fb="shareHelp"></p><div class="fb-actions"><button id="fb-export" data-fb="export"></button><button id="fb-link" data-fb="link"></button></div><textarea id="fb-json" rows="7" maxlength="8192" aria-label="Experiment JSON / 実験設定JSON"></textarea><button id="fb-apply" data-fb="apply"></button><p id="fb-share-status" role="status"></p></details></aside>
<div class="fb-results"><section class="fb-card"><h2 data-fb="viewing"></h2><div class="fb-view-controls"><label><span data-fb="selected"></span><select id="fb-selected" disabled></select></label><label><span data-fb="latitude"></span><input id="fb-latitude" type="number" min="-90" max="90" step="1"></label><label><span data-fb="day"></span><input id="fb-day" type="range" min="1" max="365" step="1"><output id="fb-day-output"></output></label></div><p class="fb-help" data-fb="band"></p><p id="fb-reading"></p><div id="fb-cards" class="fb-cards"></div><p id="fb-unsettled" class="fb-warning" hidden data-fb="unsettled"></p><p id="fb-extreme" class="fb-warning" hidden data-fb="warning"></p><p id="fb-proxy-off" class="fb-help" hidden data-fb="proxyOff"></p></section>
<section class="fb-card"><h2 data-fb="annual"></h2><p id="fb-annual-note" class="fb-help"></p><div id="fb-annual" class="fb-plot"></div></section>
<section class="fb-card"><h2 data-fb="map"></h2><p class="fb-help" data-fb="mapNote"></p><label><span data-fb="layer"></span><select id="fb-layer"><option value="temperature" data-fb="temperatureLayer"></option><option value="proxy" data-fb="proxyLayer"></option></select></label><canvas id="fb-map" height="340" role="img" aria-label="Latitude and model-year temperature map"></canvas><p id="fb-map-scale" class="fb-help"></p></section>
<section class="fb-card" id="fb-history-card" hidden><h2 data-fb="history"></h2><p class="fb-help" data-fb="historyNote"></p><div id="fb-history" class="fb-plot"></div></section>
<details class="fb-card"><summary data-fb="diagnostics"></summary><dl id="fb-diagnostics"></dl></details>
</div></main>
<section class="fb-card fb-science-note"><h2 data-fb="full"></h2><h3 data-fb="science"></h3><p data-fb="scienceText"></p><p data-fb="scienceTime"></p><p data-fb="pathScience"></p><p data-fb="sources"></p><a href="https://brian-rose.github.io/ClimateLaboratoryBook/courseware/albedo-snowball/" target="_blank" rel="noopener noreferrer">The Climate Laboratory</a> · <a href="https://climlab.readthedocs.io/en/latest/api/climlab.surface.albedo.html" target="_blank" rel="noopener noreferrer">climlab</a></section>
</div><script type="module" src="/src/feedback/page.ts"></script></body></html>
