<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mercury · Spin–Orbit Lab</title></head>
<body><div class="px-shell"><header class="px-header"><a href="./planet-explorer.html" data-en="← Planet Explorer" data-ja="← Planet Explorerへ"></a><div class="px-tools"><label>Language / 言語 <select id="mc-language"><option value="en">English</option><option value="ja">日本語</option></select></label><label><input id="mc-large" type="checkbox"><span data-en="Large text" data-ja="大きな文字"></span></label></div></header>
<section class="px-hero"><p class="px-kicker">PLANET LAB · MERCURY / v2.3</p><h1 data-en="Two years. Three turns. One solar day." data-ja="2年で3回転。太陽の1日は1回。"></h1><p data-en="A moving planet, not a frozen-orbit day-length formula. Slide through two Mercury years and watch a chosen meridian meet the Sun." data-ja="軌道を固定した昼時間の式ではなく、公転と自転を一緒に進める実験。Mercuryの2年を動かして、選んだ子午線と太陽の関係を見ます。"></p><p class="px-scope" data-en="Exact 3:2 teaching resonance, fixed orbit and 0.034° tilt. No libration, atmosphere, temperature or dated ephemeris. The meridian is a model reference, not an IAU surface longitude." data-ja="3:2を厳密に固定した教材モデル。軌道は固定、傾き0.034°。秤動・大気・温度・実際の日付は扱いません。子午線はモデルの基準で、IAU地表経度ではありません。"></p></section>
<section class="px-panel"><div class="px-row"><button id="mc-native" data-en="Mercury orbit" data-ja="Mercuryの軌道"></button><button id="mc-circle" data-en="Circular counterfactual" data-ja="円軌道との対照"></button><button id="mc-full" data-en="Whole 2-orbit view" data-ja="2公転全体を見る"></button><button id="mc-horizon" data-en="Sunrise reversal · 90° meridian" data-ja="日の出の反転・経度90°"></button></div><div class="px-fields"><label><span data-en="Latitude (+ spin pole)" data-ja="緯度（＋は自転正極）"></span><input id="mc-latitude" type="number" min="-90" max="90" step="any" value="0"></label><label><span data-en="Model meridian (°)" data-ja="モデル経度（°）"></span><input id="mc-longitude" type="number" min="-180" max="180" step="any" value="0"></label><label><span data-en="Eccentricity · 0–0.3" data-ja="離心率・0〜0.3"></span><input id="mc-eccentricity" type="number" min="0" max="0.3" step="any"></label><label><span data-en="Elapsed orbital cycles · 0–2" data-ja="公転周回数・0〜2"></span><input id="mc-cycles" type="number" min="0" max="2" step="any" value="0"></label></div><p id="mc-error" role="status" aria-live="polite"></p><div class="px-row"><button id="mc-play" aria-pressed="false"></button><button data-cycle="0" data-en="Perihelion · start" data-ja="近日点・出発"></button><button data-cycle="0.5" data-en="Aphelion" data-ja="遠日点"></button><button data-cycle="1" data-en="One year" data-ja="1年後"></button><button data-cycle="2" data-en="Two years" data-ja="2年後"></button></div><label><output id="mc-position"></output><input id="mc-timeline" type="range" min="0" max="2" step="0.0001" aria-label="Elapsed Mercury orbits / Mercury公転周回数"></label></section>
<div class="px-worlds"><section class="px-panel"><h2>Mercury · 3:2</h2><canvas class="px-world-canvas" id="mc-canvas" width="520" height="300" aria-label="Mercury illumination and orbit"></canvas><p id="mc-direction" class="px-scope" role="status"></p><p class="px-help" data-en="Spin-grid and orbit use the same elapsed time. Sphere, orbit and Sun have independent illustrative scales. White dot: selected point (visible hemisphere only). Amber line: chosen latitude. At meridian 0, the first perihelion is noon." data-ja="経線の回転と公転は同じ時間を使用。球・軌道・太陽は説明用の別縮尺です。白点は選択地点（手前側のみ）、黄色の線は緯度。モデル経度0°は最初の近日点が正午です。"></p></section><section class="px-panel"><h2 data-en="The clocks and the light" data-ja="時計と日射"></h2><div id="mc-metrics" class="px-metrics"></div></section></div>
<div class="px-worlds"><section class="px-panel"><h2 data-en="Apparent Sun longitude · unwrapped (°)" data-ja="地表に対する太陽の経度・連続角（°）"></h2><div id="mc-motion" class="px-plot"></div><p class="px-help" data-en="X: elapsed orbital cycles. Rising parts mean the apparent motion has reversed. After 2 orbits the Sun has made one net circuit, although it briefly doubles back near perihelion." data-ja="横軸は公転周回数。線が上がる区間は見かけの太陽運動の反転です。近日点付近で一時的に戻りながら、2周後には正味で太陽が1周します。"></p></section><section class="px-panel"><h2 data-en="Sun elevation at the selected point (°)" data-ja="選択地点での太陽高度（°）"></h2><div id="mc-elevation" class="px-plot"></div><p class="px-help" data-en="Above 0° is daylight for a point Sun with no refraction. This is a changing orbit, not half a mean solar day. Use the 90° meridian preset and inspect the middle perihelion closely." data-ja="太陽を点として扱い、屈折なしで0°より上なら昼です。平均太陽日の半分を昼時間にした値ではありません。経度90°のプリセットで中央の近日点を拡大観察できます。"></p></section></div>
<details class="px-panel"><summary data-en="Share & export the experiment" data-ja="実験を共有・書き出す"></summary><div class="px-row"><button id="mc-share" data-en="Create link" data-ja="リンクを作る"></button><button id="mc-copy" data-en="Copy" data-ja="コピー"></button><button id="mc-csv" data-en="Export time series CSV" data-ja="時系列CSV"></button></div><input id="mc-url" type="text" readonly aria-label="Mercury experiment URL"><p id="mc-share-status" role="status"></p></details>
<footer class="px-panel"><h2 data-en="Why this is different" data-ja="何が違う実験？"></h2><p data-en="Sidereal rotation is one turn relative to stars. A mean solar day is the net noon-to-noon cycle. Near perihelion, Mercury’s orbital angular speed temporarily outruns its spin: the apparent Sun can stop and reverse. A circular orbit with the same 3:2 ratio removes that reversal." data-ja="恒星に対する自転1回と、太陽に対する平均の1日は別物です。近日点付近では公転角速度が一時的に自転を追い越し、見かけの太陽が止まって逆向きに進みます。同じ3:2でも円軌道にすると、この反転はなくなります。"></p><p><a href="https://ssd.jpl.nasa.gov/planets/approx_pos.html">JPL · fixed orbital elements</a> · <a href="https://ssd.jpl.nasa.gov/planets/phys_par.html">JPL · periods</a> · <a href="https://arxiv.org/abs/0901.1843">Correia &amp; Laskar · 3:2</a> · <a href="https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/pck00011.tpc">NAIF · spin pole</a></p></footer></div><script type="module" src="/src/planet/mercuryPage.ts"></script></body></html>
