<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planet Explorer · Earth Lab</title></head>
<body><div class="px-shell">
<header><nav class="px-links"><a href="./index.html" data-en="← 3D Earth Lab" data-ja="← 3D Earth Lab"></a><a href="./planet-lab.html" data-en="Original Earth/Mars comparison" data-ja="従来のEarth/Mars比較"></a></nav><div class="px-tools"><label><span data-en="Language" data-ja="言語"></span><select id="px-language"><option value="en">English</option><option value="ja">日本語</option></select></label><label class="px-check"><input id="px-large" type="checkbox"><span data-en="Large text" data-ja="大きな文字"></span></label></div></header>
<section class="px-hero"><div class="px-kicker">PLANET LAB · 2.2</div><h1 data-en="Turn a world. Change a season." data-ja="世界を傾ける。季節が変わる。"></h1><p data-en="Compare a tilted Earth with Uranus. Watch one shared geometry produce light, shadow and numbers — without borrowing Earth's climate for another planet." data-ja="横倒しのEarthとUranusを比較。同じ計算から光・影・数値を描き、別の惑星に地球の気候モデルを着せません。"></p><p class="px-scope" data-en="Astronomy teaching model, not a dated ephemeris. + latitude points toward the positive spin pole (opposite IAU north on Uranus). No non-Earth temperature model." data-ja="天文の教材モデルで、実際の日付を再現する天体暦ではありません。＋緯度は自転の正極方向（UranusではIAUの北極と逆）。地球以外の温度モデルは未提供です。"></p></section>
<section id="px-recipes" class="px-row"><button data-recipe="sideways" data-en="Earth 90° ↔ Uranus" data-ja="Earth 90° ↔ Uranus"></button><button data-recipe="mars" data-en="Similar tilt, different orbit" data-ja="似た傾き・違う軌道"></button><button data-recipe="equal" data-en="Earth = Earth" data-ja="Earth = Earth"></button></section>
<main>
<details class="px-panel px-controls" id="px-controls" open><summary data-en="Experiment controls · collapse to see more sky" data-ja="実験の設定・閉じると画面を広く使えます"></summary><div class="px-settings">
<div><h3>World A</h3><label><span data-en="Planet" data-ja="惑星"></span><select id="px-a"></select></label><label class="px-check"><input id="px-custom-a" type="checkbox"><span data-en="Hypothetical tilt" data-ja="仮想の傾きに変更"></span></label><label><span data-en="Spin-axis tilt (0–180°)" data-ja="自転軸の傾き（0–180°）"></span><input id="px-tilt-a" type="number" min="0" max="180" step="any" disabled></label></div>
<div><h3>World B</h3><label><span data-en="Planet" data-ja="惑星"></span><select id="px-b"></select></label><label class="px-check"><input id="px-custom-b" type="checkbox"><span data-en="Hypothetical tilt" data-ja="仮想の傾きに変更"></span></label><label><span data-en="Spin-axis tilt (0–180°)" data-ja="自転軸の傾き（0–180°）"></span><input id="px-tilt-b" type="number" min="0" max="180" step="any" disabled></label></div>
</div><div class="px-clock"><label><span data-en="Comparison clock" data-ja="比較する時刻の揃え方"></span><select id="px-clock"><option value="season" data-en="Same seasonal angle Ls" data-ja="同じ季節角Ls"></option><option value="elapsed" data-en="Same elapsed Earth days" data-ja="同じ経過地球日数"></option></select></label><label><span data-en="Seasonal angle Ls (°)" data-ja="季節角Ls（°）"></span><input id="px-season" type="number" min="0" max="360" step="any"></label><label><span data-en="Earth days from each spring" data-ja="各世界の春からの経過地球日"></span><input id="px-days" type="number" min="0" max="100000" step="any"></label></div>
<div class="px-fields"><label><span data-en="Latitude (°; + spin pole)" data-ja="緯度（°・＋は自転の正極）"></span><input id="px-latitude" type="number" min="-90" max="90" step="any"></label><label><span data-en="Model longitude (°)" data-ja="モデル経度（°）"></span><input id="px-longitude" type="number" min="-180" max="180" step="any"></label></div>
</details>
<section class="px-panel"><div class="px-row"><button id="px-play" type="button" aria-pressed="false"></button><button data-ls="0" data-en="Spring 0°" data-ja="春 0°"></button><button data-ls="90" data-en="Summer 90°" data-ja="夏 90°"></button><button data-ls="180" data-en="Autumn 180°" data-ja="秋 180°"></button><button data-ls="270" data-en="Winter 270°" data-ja="冬 270°"></button></div><label><span id="px-timeline-label"></span><input id="px-timeline" type="range" min="0" max="360" step=".1" aria-label="Explorer timeline"></label><p id="px-clock-note" class="px-help"></p><p id="px-notice" role="status" aria-live="polite"></p></section>
<div class="px-worlds"><section class="px-panel" id="px-world-a"><div class="px-world-heading"><h2></h2><span>World A</span></div><canvas id="px-canvas-a" class="px-world-canvas" width="520" height="300" role="img"></canvas><p class="px-legend-note" data-en="Schematic sphere + independently scaled orbit. Amber: selected latitude. Square: subsolar point. White dot: selected location, when visible." data-ja="模式球＋各惑星別スケールの軌道。琥珀の線：選択緯度／四角：太陽直下点／白点：選択地点（見える側のみ）。"></p><div class="px-metrics"></div><p class="px-capability px-help"></p></section>
<section class="px-panel" id="px-world-b"><div class="px-world-heading"><h2></h2><span>World B</span></div><canvas id="px-canvas-b" class="px-world-canvas" width="520" height="300" role="img"></canvas><p class="px-legend-note" data-en="Schematic sphere + independently scaled orbit. The axis stays fixed while orbital position changes. No cloud or terrain model." data-ja="模式球＋各惑星別スケールの軌道。公転位置が変わっても軸は固定。雲や地形の計算ではありません。"></p><div class="px-metrics"></div><p class="px-capability px-help"></p></section></div>
<div class="px-plots"><section class="px-panel"><h2 data-en="Illuminated fraction of a frozen rotation (%)" data-ja="軌道を止めた一回転の明るい割合（％）"></h2><div class="px-legend"><span>━━ World A</span><span>┄┄ World B</span></div><div id="px-fraction" class="px-plot"></div><p class="px-help" data-en="Horizontal axis: seasonal angle Ls (°). A rotation at fixed orbital position, not the actual duration from sunrise to sunset." data-ja="横軸：季節角Ls（°）。公転位置を固定した回転の比較で、実際の日の出から日没までの時間ではありません。"></p></section><section class="px-panel"><h2 data-en="Frozen-rotation mean sunlight (W/m²)" data-ja="軌道を止めた回転平均の日射（W/m²）"></h2><div class="px-legend"><span>━━ World A</span><span>┄┄ World B</span></div><div id="px-energy" class="px-plot"></div><p class="px-help" data-en="Same absolute scale for both worlds. TOA horizontal flux, no atmosphere. Equal-angle samples are not an annual time average." data-ja="両世界で同じ絶対値スケール。大気上端の水平面日射で、大気の影響は含みません。等角度の点を単純平均しても年平均にはなりません。"></p></section></div>
<details class="px-panel"><summary data-en="Share / save this experiment" data-ja="この実験を共有・保存"></summary><div class="px-row"><button id="px-share" data-en="Create link" data-ja="リンク作成"></button><button id="px-save" data-en="Save settings" data-ja="設定を保存"></button></div><div class="px-share-row"><input id="px-url" readonly aria-label="Explorer share URL"><button id="px-copy" data-en="Copy" data-ja="コピー"></button></div><p id="px-share-status" class="px-help" role="status"></p><label><span data-en="Settings JSON" data-ja="設定JSON"></span><textarea id="px-json" maxlength="4096" rows="5"></textarea></label><button id="px-load" data-en="Apply settings" data-ja="設定を適用"></button></details>
</main><footer class="px-panel"><h2 data-en="Sources & model boundaries" data-ja="出典・モデルの範囲"></h2><p class="px-help" data-en="Fixed Kepler worlds, not simultaneous planets in one live solar system. No temperatures, atmosphere, interactions, precession or weather. Uranus uses its spin-positive pole; + and − are model latitude labels. At an all-day horizon, 50% is a reporting convention and incoming horizontal energy is zero." data-ja="固定Keplerモデルの世界比較で、同じ太陽系の実時刻ではありません。温度・大気・相互作用・歳差・天気は計算しません。Uranusの＋／−は自転の正極を使うモデル緯度です。太陽が一日中地平線上にある場合の50％は表示上の規約で、水平面への入射エネルギーはゼロです。"></p><nav class="px-links"><a href="https://ssd.jpl.nasa.gov/planets/approx_pos.html">JPL · Kepler elements</a><a href="https://ssd.jpl.nasa.gov/planets/phys_par.html">JPL · physical parameters</a><a href="https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/pck00011.tpc">NAIF · pole convention</a><a href="https://science.nasa.gov/uranus/facts/">NASA · Uranus</a></nav></footer>
</div><script type="module" src="/src/planet/explorer.ts"></script></body></html>
