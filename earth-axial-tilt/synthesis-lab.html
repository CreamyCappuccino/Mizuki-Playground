<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Milankovitch Explorer · Earth Lab</title></head>
<body><div class="sy-shell"><header><a href="./index.html" data-sy="back"></a><div class="sy-tools"><label><span data-sy="language"></span><select id="sy-language"><option value="en">English</option><option value="ja">日本語</option></select></label><label class="sy-check"><input id="sy-large" type="checkbox"><span data-sy="large"></span></label></div></header>
<section class="sy-hero"><p class="sy-eyebrow" data-sy="eyebrow"></p><h1 data-sy="title"></h1><h2 data-sy="lead"></h2><p data-sy="intro"></p><p class="sy-scope" data-sy="scope"></p></section>
<main class="sy-layout"><aside><form id="sy-form" class="sy-card"><h2 data-sy="controls"></h2><label><span data-sy="parameter"></span><select id="sy-parameter"><option value="tilt" data-sy="tilt"></option><option value="eccentricity" data-sy="eccentricity"></option><option value="perihelionSeason" data-sy="perihelionSeason"></option></select></label>
<div class="sy-fields"><label><span data-sy="start"></span><input id="sy-start" type="number" step="any" required></label><label><span data-sy="end"></span><input id="sy-end" type="number" step="any" required></label><label><span data-sy="count"></span><input id="sy-count" type="number" min="3" max="41" step="1" required></label><label><span data-sy="latitude"></span><input id="sy-latitude" type="number" min="-90" max="90" step="any" required></label></div>
<label><span data-sy="summer"></span><select id="sy-summer"><option value="90" data-sy="north"></option><option value="270" data-sy="south"></option></select></label><h3 data-sy="base"></h3>
<div class="sy-fields"><label><span data-sy="tilt"></span><input id="sy-tilt" type="number" min="0" max="90" step="any" required></label><label><span data-sy="eccentricity"></span><input id="sy-eccentricity" type="number" min="0" max="0.3" step="any" required></label><label><span data-sy="peri"></span><input id="sy-perihelion" type="number" min="0" max="360" step="any" required></label><label><span data-sy="axis"></span><input id="sy-axis" type="number" min="0" max="360" step="any" required></label></div><p class="sy-help" data-sy="parameterHelp"></p>
<div class="sy-actions"><button id="sy-run" type="submit" class="sy-primary" data-sy="run"></button><button id="sy-cancel" type="button" data-sy="cancel" disabled></button></div><p id="sy-status" role="status" aria-live="polite"></p><p id="sy-error" role="alert"></p></form>
<details class="sy-card"><summary data-sy="share"></summary><div class="sy-actions"><button id="sy-export" data-sy="export"></button><button id="sy-link" data-sy="shareLink"></button><button id="sy-csv" data-sy="csv" disabled></button></div><textarea id="sy-json" rows="8" maxlength="8192" aria-label="Experiment JSON / 実験設定JSON"></textarea><button id="sy-apply" data-sy="apply"></button><label><span data-sy="shareLink"></span><input id="sy-url" type="text" readonly></label><p id="sy-share-status" role="status"></p></details></aside>
<div class="sy-results"><section class="sy-card"><h2 data-sy="results"></h2><div class="sy-fields"><label><span data-sy="selected"></span><select id="sy-selected" disabled></select></label><label><span data-sy="comparison"></span><select id="sy-comparison" disabled></select></label></div><p class="sy-help" data-sy="contrastNote"></p><p id="sy-orbits" class="sy-help"></p><div id="sy-cards" class="sy-cards"></div><p id="sy-empty" data-sy="empty"></p><p class="sy-help" data-sy="degenerate"></p></section>
<section class="sy-card"><h2 data-sy="trend"></h2><label><span data-sy="metric"></span><select id="sy-metric"><option value="solstice" data-sy="solstice"></option><option value="halfMean" data-sy="halfMean"></option><option value="halfDays" data-sy="halfDays"></option><option value="halfEnergy" data-sy="halfEnergy"></option><option value="annualMean" data-sy="annualMean"></option><option value="globalMean" data-sy="globalMean"></option></select></label><div id="sy-trend" class="sy-plot"></div></section>
<section class="sy-card"><h2 data-sy="annual"></h2><p class="sy-help" data-sy="annualNote"></p><div id="sy-annual" class="sy-plot"></div></section>
<section class="sy-card"><h2 data-sy="atlas"></h2><p class="sy-help" data-sy="atlasNote"></p><canvas id="sy-map" role="img" height="340" hidden></canvas><div id="sy-ramp" hidden></div><p id="sy-map-scale" class="sy-help"></p></section>
<section class="sy-card"><h2 data-sy="transfer"></h2><div class="sy-fields"><label><span data-sy="profile"></span><select id="sy-profile"><option value="classic" data-sy="classic"></option><option value="idealized-land" data-sy="land"></option><option value="idealized-ocean" data-sy="ocean"></option><option value="earth-geography" data-sy="geography"></option></select></label><label><span data-sy="depth"></span><select id="sy-depth"><option value="2.5">2.5</option><option value="10">10</option><option value="50">50</option></select></label><label><span data-sy="longitude"></span><input id="sy-longitude" type="number" min="-180" max="180" step="any" required></label></div><p class="sy-help" data-sy="linkOnly"></p><p id="sy-storage" class="sy-help"></p><div class="sy-actions"><a id="sy-earth" class="sy-button" data-sy="openEarth"></a><a id="sy-feedback" class="sy-button" data-sy="openFeedback"></a></div><p class="sy-help" data-sy="bridgeNote"></p></section>
<details class="sy-card"><summary data-sy="table"></summary><div class="sy-table-wrap" tabindex="0" aria-label="Sweep table / 走査数値表"><table id="sy-table"></table></div></details></div></main>
<section class="sy-section"><h2 data-sy="recipes"></h2><p data-sy="recipesNote"></p><div id="sy-recipes" class="sy-recipes"></div></section>
<footer class="sy-card"><h2 data-sy="sources"></h2><p data-sy="sourceNote"></p><p><a href="https://science.nasa.gov/science-research/earth-science/milankovitch-orbital-cycles-and-their-role-in-earths-climate/" rel="noreferrer">NASA · Milankovitch</a> · <a href="https://brian-rose.github.io/ClimateLaboratoryBook/courseware/insolation/" rel="noreferrer">The Climate Laboratory · Insolation</a></p></footer></div><script type="module" src="/src/synthesis/page.ts"></script></body></html>
