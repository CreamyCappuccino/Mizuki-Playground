name: Earth Axial Tilt CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: earth-axial-tilt
      - name: Pack tracked project and locked dependencies only
        run: |
          git ls-files -z earth-axial-tilt AGENTS.md | tar --null -T - -cf /tmp/planet-workspace.tar
          tar -rf /tmp/planet-workspace.tar earth-axial-tilt/node_modules
          gzip /tmp/planet-workspace.tar
      - uses: actions/upload-artifact@v4
        with:
          name: planet-cloud-workspace
          path: /tmp/planet-workspace.tar.gz
          retention-days: 2
