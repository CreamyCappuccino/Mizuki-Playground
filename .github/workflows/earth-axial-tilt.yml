name: Earth cloud development snapshot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked project dependencies
        working-directory: earth-axial-tilt
        run: npm ci
      - name: Export project and locked Linux dependencies (no Git metadata or credentials)
        run: |
          git rev-parse HEAD > earth-cloud-revision.txt
          tar --exclude='.git' --exclude='.env*' --exclude='.npmrc' -czf /tmp/earth-cloud-source.tgz AGENTS.md earth-cloud-revision.txt earth-axial-tilt .github/workflows/earth-axial-tilt.yml
          sha256sum /tmp/earth-cloud-source.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: earth-cloud-source
          path: /tmp/earth-cloud-source.tgz
          retention-days: 1
          if-no-files-found: error
