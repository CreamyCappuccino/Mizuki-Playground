name: Earth cloud development snapshot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble exact accepted source and locked Linux dependencies
        run: |
          git archive --format=tar HEAD > /tmp/earth-source.tar
          npm ci --prefix earth-axial-tilt
          tar -C earth-axial-tilt -czf /tmp/earth-node-modules.tar.gz node_modules
          sha256sum /tmp/earth-source.tar /tmp/earth-node-modules.tar.gz > /tmp/SHA256SUMS
          git rev-parse HEAD > /tmp/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: earth-v15-cloud-source
          path: |
            /tmp/earth-source.tar
            /tmp/earth-node-modules.tar.gz
            /tmp/SHA256SUMS
            /tmp/commit.txt
          retention-days: 2
