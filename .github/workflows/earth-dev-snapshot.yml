name: Earth development snapshot
on:
  push:
    branches: ['mizuki/earth-first-11']
    paths: ['.github/workflows/earth-dev-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locked dependencies for the isolated review workspace
        working-directory: earth-axial-tilt
        run: npm ci
      - name: Export public source and installed build tools only
        run: |
          tar -czf "$RUNNER_TEMP/earth-dev-snapshot.tar.gz" AGENTS.md .github/workflows/earth-axial-tilt.yml earth-axial-tilt
      - uses: actions/upload-artifact@v4
        with:
          name: earth-dev-snapshot
          path: ${{ runner.temp }}/earth-dev-snapshot.tar.gz
          retention-days: 1
