name: Earth review snapshot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the locked Earth dependencies
        working-directory: earth-axial-tilt
        run: npm ci
      - name: Build the reviewed application
        working-directory: earth-axial-tilt
        run: npm run build
      - name: Package only tracked Earth source, generated build and installed dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/earth-review/earth-axial-tilt
          git archive HEAD earth-axial-tilt | tar -x -C /tmp/earth-review
          cp -a earth-axial-tilt/node_modules /tmp/earth-review/earth-axial-tilt/
          cp -a earth-axial-tilt/dist /tmp/earth-review/earth-axial-tilt/
          printf '%s\n' "$GITHUB_SHA" > /tmp/earth-review/REVIEWED_SHA.txt
          tar -czf /tmp/earth-review-snapshot.tar.gz -C /tmp/earth-review .
      - uses: actions/upload-artifact@v4
        with:
          name: earth-review-snapshot
          path: /tmp/earth-review-snapshot.tar.gz
          retention-days: 1
          compression-level: 0
